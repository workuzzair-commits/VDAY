<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Interactive</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #ffcccc;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 2.5rem;
            color: #ff69b4;
        }
        .button {
            padding: 1rem 2rem;
            margin: 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .yes {
            background-color: #32cd32;
        }
        .no {
            background-color: #ff4500;
        }
        .yes:hover {
            transform: scale(1.1);
        }
        .no:hover {
            transform: translateX(-10px);
        }
        .message {
            font-size: 1.5rem;
            margin-top: 20px;
            visibility: hidden;
        }
        .heart {
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: red;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <button class="button yes" onclick="showMessage('Yes! ❤️')">Yes</button>
    <button class="button no" onclick="moveNoButton(event)">No</button>
    <div class="heart"></div>
    <p class="message" id="message"></p>
    <audio id="music" src="valentines-music.mp3" loop></audio>
    <script>
        document.getElementById('music').play();
        function showMessage(msg) {
            document.getElementById('message').textContent = msg;
            document.getElementById('message').style.visibility = 'visible';
        }
        function moveNoButton(event) {
            const button = event.target;
            const { clientX, clientY } = event;
            const x = Math.random() * (window.innerWidth - button.offsetWidth);
            const y = Math.random() * (window.innerHeight - button.offsetHeight);
            button.style.position = 'absolute';
            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }
    </script>
</body>
</html>
